name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore HardwareTemplateBuilder.sln

      - name: Build
        run: dotnet build HardwareTemplateBuilder.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HardwareTemplateBuilder.sln --configuration Release --no-build

      - name: Publish Windows x64 app
        run: |
          dotnet publish HardwareTemplateBuilder.App/HardwareTemplateBuilder.App.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            /p:PublishSingleFile=true \
            /p:IncludeNativeLibrariesForSelfExtract=true \
            --output artifacts/win-x64

      - name: Zip artifact
        run: |
          VERSION="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi

          cd artifacts
          zip -r "HardwareTemplateBuilder-${VERSION}-win-x64.zip" win-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          files: artifacts/HardwareTemplateBuilder-*-win-x64.zip
