name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    # Windows runner: both apps build against the Windows 10 SDK there (built-in text
    # recognition for scanned PDFs), and the WPF frontend only runs on Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore HardwareTemplateBuilder.sln

      - name: Build
        run: dotnet build HardwareTemplateBuilder.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HardwareTemplateBuilder.Tests --configuration Release --no-build

      - name: Publish Avalonia app (win-x64)
        run: >
          dotnet publish HardwareTemplateBuilder.App/HardwareTemplateBuilder.App.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/app-win-x64

      - name: Publish WPF app (win-x64)
        run: >
          dotnet publish HardwareTemplateBuilder.Wpf/HardwareTemplateBuilder.Wpf.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/wpf-win-x64

      - name: Zip artifacts
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $version = "${{ github.event.inputs.version }}" }
          Compress-Archive -Path artifacts/app-win-x64/* -DestinationPath "artifacts/HardwareTemplateBuilder-$version-win-x64.zip"
          Compress-Archive -Path artifacts/wpf-win-x64/* -DestinationPath "artifacts/HardwareTemplateBuilder95-$version-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*-win-x64.zip
