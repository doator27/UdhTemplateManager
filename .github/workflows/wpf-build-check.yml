# Temporary: compile check for the WPF frontend branch. Remove before merging.
name: WPF build check
on:
  push:
    branches: [wpf-win95-frontend]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build HardwareTemplateBuilder.Wpf/HardwareTemplateBuilder.Wpf.csproj -c Release -warnaserror:CS0103,CS0117,CS0246,CS1061
