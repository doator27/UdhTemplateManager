name: temp-build-check
on: push
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet build HardwareTemplateBuilder.Tests -c Release
      - run: dotnet test HardwareTemplateBuilder.Tests -c Release --no-build --filter "FullyQualifiedName~LiveCatalogSmoke" --logger "console;verbosity=detailed"
        env: { LIVE_SMOKE: '1' }
