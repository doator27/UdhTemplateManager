name: temp-build-check
on: push
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - shell: pwsh
        run: |
          foreach ($p in @(
            @('HardwareTemplateBuilder.Wpf/HardwareTemplateBuilder.Wpf.csproj','FolderProfile'),
            @('HardwareTemplateBuilder.App/HardwareTemplateBuilder.App.csproj','FolderProfile2'),
            @('HardwareTemplateBuilder.App/HardwareTemplateBuilder.App.csproj','FolderProfile1'),
            @('HardwareTemplateBuilder.Lookup/HardwareTemplateBuilder.Lookup.csproj','FolderProfile'))) {
            $out = "out_$($p[1])_$([IO.Path]::GetFileNameWithoutExtension($p[0]))"
            dotnet publish $p[0] -p:PublishProfile=$($p[1]) -p:PublishDir="$PWD\$out\" | Select-String -Pattern "error" 
            Write-Host "== $out"; Get-ChildItem $out | ForEach-Object { Write-Host "FILE $($_.Name) $($_.Length)" }
          }
