# Temporary: build + test check. Remove after it passes.
name: Temp build check
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build HardwareTemplateBuilder.sln -c Release
      - run: dotnet test HardwareTemplateBuilder.Tests/HardwareTemplateBuilder.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
      - run: Get-Content HardwareTemplateBuilder.Wpf/bin/Release/net8.0-windows/HardwareTemplateBuilder.Wpf.runtimeconfig.json
